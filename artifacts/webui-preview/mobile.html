<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#111a1b}iframe{border:0;width:390px;height:1350px;display:block;margin:auto}</style><iframe src="index.html#settings" title="Мобильный предпросмотр"></iframe><script>document.querySelector('iframe').onload=function(){let d=this.contentDocument,w=this.contentWindow,results=[];for(let width of [320,390]){this.style.width=width+'px';for(let key of ['radio','settings','character']){w.location.hash=key;w.showPanel();d.querySelectorAll('details').forEach(e=>e.open=true);results.push({section:key,width:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth});}}this.style.width='390px';w.location.hash='settings';w.showPanel();d.querySelectorAll('details').forEach((e,i)=>e.open=i===0);let p=document.createElement('pre');p.id='layout-check';p.hidden=true;p.textContent=JSON.stringify(results);document.body.append(p);};</script>
